task: detection
evaluator:
  type: CocoEvaluator
  iou_types:
  - bbox
  using_tiny_metrice: false
  using_vtiny_metrice: false
  max_dets: 100
num_classes: 10
remap_mscoco_category: false
train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /25085400120/DEIM/work/DEIM_1572862469/dataset_visdrone/VisDrone2019-DET-train/images
    ann_file: /25085400120/DEIM/work/DEIM_1572862469/dataset_visdrone/VisDrone2019-DET-train/annotations/train.json
    return_masks: false
    transforms:
      type: Compose
      ops:
      - type: Mosaic
        output_size: 320
        rotation_range: 10
        translation_range:
        - 0.1
        - 0.1
        scaling_range:
        - 0.5
        - 1.5
        probability: 1.0
        fill_value: 0
        use_cache: false
        max_cached_images: 50
        random_pop: true
      - type: RandomPhotometricDistort
        p: 0.5
      - type: RandomZoomOut
        fill: 0
        p: 0.5
      - type: RandomIoUCrop
        p: 0.8
      - type: SanitizeBoundingBoxes
        min_size: 1
      - type: RandomHorizontalFlip
      - type: Resize
        size:
        - 640
        - 640
      - type: SanitizeBoundingBoxes
        min_size: 1
      - type: ConvertPILImage
        dtype: float32
        scale: true
      - type: ConvertBoxes
        fmt: cxcywh
        normalize: true
      policy:
        name: stop_epoch
        epoch:
        - 4
        - 46
        - 84
        ops:
        - Mosaic
        - RandomPhotometricDistort
        - RandomZoomOut
        - RandomIoUCrop
      mosaic_prob: 0.5
  shuffle: true
  num_workers: 4
  drop_last: true
  pin_memory: true
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
    base_size_repeat: null
    stop_epoch: 84
    ema_restart_decay: 0.9999
    mixup_prob: 0.5
    mixup_epochs:
    - 4
    - 46
  total_batch_size: 4
val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /25085400120/DEIM/work/DEIM_1572862469/dataset_visdrone/VisDrone2019-DET-val/images
    ann_file: /25085400120/DEIM/work/DEIM_1572862469/dataset_visdrone/VisDrone2019-DET-val/annotations/val.json
    return_masks: false
    transforms:
      type: Compose
      ops:
      - type: Resize
        size:
        - 640
        - 640
      - type: ConvertPILImage
        dtype: float32
        scale: true
  shuffle: false
  num_workers: 4
  drop_last: false
  pin_memory: true
  collate_fn:
    type: BatchImageCollateFunction
  total_batch_size: 4
print_freq: 40
output_dir: /25085400120/DEIM/experiments/visdrone_light_20260928_090716/structural_candidates/outputs/d1_zoomout_p05_seed1_full96_20261002_v1
checkpoint_freq: 4
plot_train_batch_freq: 1000000
sync_bn: false
find_unused_parameters: false
verbose_type: origin
use_amp: true
scaler:
  type: GradScaler
  enabled: true
  init_scale: 1024.0
use_ema: true
ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 1000
  start: 0
cache_imgsz: null
ram_cache: false
yolo_metrice: false
baseline_log_monitor:
  enabled: false
epoches: 96
clip_max_norm: 0.1
optimizer:
  type: AdamW
  lr: 0.0002
  betas:
  - 0.9
  - 0.999
  weight_decay: 0.0001
  params:
  - params: ^(?=.*backbone)(?!.*(?:bn|norm|bias)).*$
    lr: 0.0001
  - params: ^(?=.*backbone)(?=.*(?:bn|norm|bias)).*$
    lr: 0.0001
    weight_decay: 0.0
  - params: ^(?!.*backbone)(?=.*(?:bn|norm|bias)).*$
    weight_decay: 0.0
lr_scheduler:
  type: MultiStepLR
  milestones:
  - 500
  gamma: 0.1
lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 500
model: DEIM
criterion: DEIMCriterion
postprocessor: PostProcessor
use_focal_loss: true
eval_spatial_size:
- 640
- 640
DEIM:
  backbone: HGNetv2
  encoder: HybridEncoder
  decoder: DFINETransformer
lrsheduler: flatcosine
lr_gamma: 0.5
warmup_iter: 1000
flat_epoch: 46
no_aug_epoch: 12
HGNetv2:
  pretrained: false
  local_model_dir: ./weight/hgnetv2/
  name: B0
  return_idx:
  - 1
  - 2
  - 3
  freeze_at: -1
  freeze_norm: false
  use_lab: true
  agg: se
HybridEncoder:
  in_channels:
  - 256
  - 512
  - 1024
  feat_strides:
  - 8
  - 16
  - 32
  hidden_dim: 256
  use_encoder_idx:
  - 2
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.0
  enc_act: gelu
  expansion: 0.5
  depth_mult: 0.34
  act: silu
DFINETransformer:
  feat_channels:
  - 256
  - 256
  - 256
  feat_strides:
  - 8
  - 16
  - 32
  hidden_dim: 256
  num_levels: 3
  num_layers: 3
  eval_idx: -1
  num_queries: 300
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  reg_max: 32
  reg_scale: 4
  layer_scale: 1
  num_points:
  - 3
  - 6
  - 3
  cross_attn_method: default
  query_select_method: default
  dim_feedforward: 1024
  activation: silu
  mlp_act: silu
PostProcessor:
  num_top_queries: 300
DEIMCriterion:
  weight_dict:
    loss_vfl: 1
    loss_bbox: 5
    loss_giou: 2
    loss_fgl: 0.15
    loss_ddf: 1.5
    loss_mal: 1
  losses:
  - mal
  - boxes
  - local
  alpha: 0.75
  gamma: 1.5
  reg_max: 32
  matcher:
    type: HungarianMatcher
    weight_dict:
      cost_class: 2
      cost_bbox: 5
      cost_giou: 2
    alpha: 0.25
    gamma: 2.0
use_swanlab: false
score_threshold: 0.0
metric_lr_reducer:
  enabled: false
afss:
  enabled: false
seed: 1
tuning: /25085400120/DEIM/experiments/visdrone_light_20260928_090716/artifacts/common_init_seed0.pth
resume: null
