{
  "task": "detection",
  "evaluator": {
    "type": "CocoEvaluator",
    "iou_types": [
      "bbox"
    ],
    "using_tiny_metrice": false,
    "using_vtiny_metrice": false,
    "max_dets": 100
  },
  "num_classes": 10,
  "remap_mscoco_category": false,
  "train_dataloader": {
    "type": "DataLoader",
    "dataset": {
      "type": "CocoDetection",
      "img_folder": "C:\\Users\\jiwei\\Desktop\\DEIM\\dataset_visdrone\\VisDrone2019-DET-train\\images",
      "ann_file": "C:\\Users\\jiwei\\Desktop\\DEIM\\dataset_visdrone\\VisDrone2019-DET-train\\annotations\\train.json",
      "return_masks": false,
      "transforms": {
        "type": "Compose",
        "ops": [
          {
            "type": "Mosaic",
            "output_size": 320,
            "rotation_range": 10,
            "translation_range": [
              0.1,
              0.1
            ],
            "scaling_range": [
              0.5,
              1.5
            ],
            "probability": 1.0,
            "fill_value": 0,
            "use_cache": false,
            "max_cached_images": 50,
            "random_pop": true
          },
          {
            "type": "RandomPhotometricDistort",
            "p": 0.5
          },
          {
            "type": "RandomZoomOut",
            "fill": 0
          },
          {
            "type": "RandomIoUCrop",
            "p": 0.8
          },
          {
            "type": "SanitizeBoundingBoxes",
            "min_size": 1
          },
          {
            "type": "RandomHorizontalFlip"
          },
          {
            "type": "Resize",
            "size": [
              640,
              640
            ]
          },
          {
            "type": "SanitizeBoundingBoxes",
            "min_size": 1
          },
          {
            "type": "ConvertPILImage",
            "dtype": "float32",
            "scale": true
          },
          {
            "type": "ConvertBoxes",
            "fmt": "cxcywh",
            "normalize": true
          }
        ],
        "policy": {
          "name": "stop_epoch",
          "epoch": [
            4,
            64,
            120
          ],
          "ops": [
            "Mosaic",
            "RandomPhotometricDistort",
            "RandomZoomOut",
            "RandomIoUCrop"
          ]
        },
        "mosaic_prob": 0.5
      }
    },
    "shuffle": true,
    "num_workers": 4,
    "drop_last": true,
    "pin_memory": true,
    "collate_fn": {
      "type": "BatchImageCollateFunction",
      "base_size": 640,
      "base_size_repeat": 20,
      "stop_epoch": 120,
      "ema_restart_decay": 0.9999,
      "mixup_prob": 0.5,
      "mixup_epochs": [
        4,
        64
      ]
    },
    "total_batch_size": 4
  },
  "val_dataloader": {
    "type": "DataLoader",
    "dataset": {
      "type": "CocoDetection",
      "img_folder": "C:\\Users\\jiwei\\Desktop\\DEIM\\dataset_visdrone\\VisDrone2019-DET-val\\images",
      "ann_file": "C:\\Users\\jiwei\\Desktop\\DEIM\\dataset_visdrone\\VisDrone2019-DET-val\\annotations\\val.json",
      "return_masks": false,
      "transforms": {
        "type": "Compose",
        "ops": [
          {
            "type": "Resize",
            "size": [
              640,
              640
            ]
          },
          {
            "type": "ConvertPILImage",
            "dtype": "float32",
            "scale": true
          }
        ]
      }
    },
    "shuffle": false,
    "num_workers": 4,
    "drop_last": false,
    "pin_memory": true,
    "collate_fn": {
      "type": "BatchImageCollateFunction"
    },
    "total_batch_size": 4
  },
  "print_freq": 20,
  "output_dir": "C:\\Users\\jiwei\\Desktop\\小论文投稿\\英文小论文\\code\\fine_residual_geometry_20261008_v1\\runs\\fine_residual_seed2",
  "checkpoint_freq": 4,
