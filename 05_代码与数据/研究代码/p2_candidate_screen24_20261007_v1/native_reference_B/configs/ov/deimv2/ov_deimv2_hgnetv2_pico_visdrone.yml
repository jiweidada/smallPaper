__include__: [
  '../../deimv2/deimv2_hgnetv2_pico_coco.yml',
  '../../dataset/visdrone_detection.yml',
  './_base_ov_deimv2.yml',
]

output_dir: ./outputs/ov/deimv2/ov_deimv2_hgnetv2_pico_visdrone

OVDEIM:
  encoder: LiteEncoder
  img_dim: 112

OVDEIMV2Transformer:
  feat_channels: [112, 112]
  feat_strides: [16, 32]
  hidden_dim: 112
  num_levels: 2
  num_points: [4, 2]
  num_layers: 3
  num_queries: 200
  dim_feedforward: 320

DEIMCriterion:
  matcher:
    matcher_change_epoch: 450
