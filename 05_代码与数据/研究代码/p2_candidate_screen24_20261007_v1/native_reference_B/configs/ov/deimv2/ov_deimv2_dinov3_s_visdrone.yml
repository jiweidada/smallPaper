__include__: [
  '../../deimv2/deimv2_dinov3_s_coco.yml',
  '../../dataset/visdrone_detection.yml',
  './_base_ov_deimv2.yml',
]

output_dir: ./outputs/ov/deimv2/ov_deimv2_dinov3_s_visdrone

OVDEIM:
  backbone: DINOv3STAs
  img_dim: 192

OVDEIMV2Transformer:
  feat_channels: [192, 192, 192]
  hidden_dim: 192

optimizer:
  params:
    -
      params: '^(?=.*.dinov3)(?!.*(?:norm|bn|bias)).*$'
      lr: 0.000025
    -
      params: '^(?=.*.dinov3)(?=.*(?:norm|bn|bias)).*$'
      lr: 0.000025
      weight_decay: 0.
    -
      params: '^(?=.*(?:sta|encoder|decoder|text_adapter))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

DEIMCriterion:
  matcher:
    matcher_change_epoch: 100

train_dataloader:
  dataset:
    transforms:
      ops:
        - {type: Mosaic, output_size: 320, rotation_range: 10, translation_range: [0.1, 0.1], scaling_range: [0.5, 1.5], probability: 1.0, fill_value: 0, use_cache: True, max_cached_images: 50, random_pop: True}
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640], }
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}

val_dataloader:
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [640, 640], }
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
