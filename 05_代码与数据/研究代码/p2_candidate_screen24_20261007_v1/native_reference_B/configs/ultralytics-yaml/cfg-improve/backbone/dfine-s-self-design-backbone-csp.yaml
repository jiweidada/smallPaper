backbone:
  # [from, module, args]
  - [-1, RepStem,      [32]]                                                              # 0-P2/4
  - [-1, C2f_Block,    [64,   {'module': InceptionDWBlock, 'param': {'mlp_ratio': 4.0}}, 2]]  # 1-P2/4
  - [-1, ADown,        [128]]                                                             # 2-P3/8
  - [-1, C2f_Block,    [128,  {'module': InceptionDWBlock, 'param': {'mlp_ratio': 4.0}}, 2]]  # 3-P3/8
  - [-1, ADown,        [256]]                                                             # 4-P4/16
  - [-1, C2f_Block,    [256,  {'module': InceptionDWBlock, 'param': {'mlp_ratio': 4.0}}, 2]]  # 5-P4/16
  - [-1, ADown,        [512]]                                                             # 6-P5/32
  - [-1, C2f_Block,    [1024, {'module': InceptionDWBlock, 'param': {'mlp_ratio': 4.0}}, 2]]  # 7-P5/32

encoder:
  - [3,  ConvNormLayer_fuse, [256, 1, 1]]                              # 8-P3/8  (from backbone[3])
  - [5,  ConvNormLayer_fuse, [256, 1, 1]]                              # 9-P4/16 (from backbone[5])
  - [7,  ConvNormLayer_fuse, [256, 1, 1]]                              # 10-P5/32 (from backbone[7])

  - [-1, TransformerEncoderBlock, [8, 1024, 0.1, "relu", 10000, False]] # 11-P5/32

  - [-1, ConvNormLayer_fuse, [256, 1, 1]]                              # 12-P5/32
  - [-1, nn.Upsample,        [None, 2, "nearest"]]                     # 13-P4/16
  - [[-1, 9],  Concat, []]                                             # 14-P4/16 (cat with encoder[9])
  - [-1, RepNCSPELAN4, [256, 512, 64, 1, False, 'silu']]               # 15-P4/16

  - [-1, ConvNormLayer_fuse, [256, 1, 1]]                              # 16-P4/16
  - [-1, nn.Upsample,        [None, 2, "nearest"]]                     # 17-P3/8
  - [[-1, 8],  Concat, []]                                             # 18-P3/8  (cat with encoder[8])
  - [-1, RepNCSPELAN4, [256, 512, 64, 1, False, 'silu']]               # 19-P3/8

  - [-1, SCDown,   [256, 3, 2, 'silu']]                                # 20-P4/16
  - [[-1, 16], Concat, []]                                             # 21-P4/16 (cat with encoder[16])
  - [-1, RepNCSPELAN4, [256, 512, 64, 1, False, 'silu']]               # 22-P4/16

  - [-1, SCDown,   [256, 3, 2, 'silu']]                                # 23-P5/32
  - [[-1, 12], Concat, []]                                             # 24-P5/32 (cat with encoder[12])
  - [-1, RepNCSPELAN4, [256, 512, 64, 1, False, 'silu']]               # 25-P5/32

decoder:
  - [[19, 22, 25], DFINETransformer, {"feat_strides": [8, 16, 32], "hidden_dim": 256, "num_levels": 3, "num_layers": 3, "num_points": [3, 6, 3], "dim_feedforward": 1024}]