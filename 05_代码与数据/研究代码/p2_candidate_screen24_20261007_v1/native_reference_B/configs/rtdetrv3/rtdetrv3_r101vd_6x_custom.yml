__include__: [
  '../dataset/custom_detection.yml',
  '../runtime.yml',
  '../base/dataloader_dfine.yml',
  '../base/rt_optimizer.yml',
  '../base/rtdetrv2_r50vd.yml',
]

print_freq: 20
output_dir: ./outputs/rtdetrv3_r101vd_6x_custom

DEIM:
  o2m_c: true

PResNet:
  depth: 101
  freeze_at: -1
  freeze_norm: False
  pretrained: False


HybridEncoder:
  # intra
  hidden_dim: 384
  dim_feedforward: 2048


RTDETRTransformerv2:
  feat_channels: [384, 384, 384]
  mgsa_groups: 3
  mgsa_mask_ratio: 0.1
  o2m_t: true
  num_queries_o2m: 450
  o2m_repeat: 4


optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.000001
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.

  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001


train_dataloader:
  total_batch_size: 4

val_dataloader:
  total_batch_size: 4
