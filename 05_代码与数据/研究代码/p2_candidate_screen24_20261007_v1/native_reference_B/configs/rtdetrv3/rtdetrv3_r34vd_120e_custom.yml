__include__: [
  '../dataset/custom_detection.yml',
  '../runtime.yml',
  '../base/dataloader_dfine.yml',
  '../base/rt_optimizer.yml',
  '../base/rtdetrv2_r50vd.yml',
]

print_freq: 20
output_dir: ./outputs/rtdetrv3_r34vd_120e_custom

DEIM:
  o2m_c: true

PResNet:
  depth: 34
  freeze_at: -1
  freeze_norm: False
  pretrained: False


HybridEncoder:
  in_channels: [128, 256, 512]
  hidden_dim: 256
  expansion: 0.5


RTDETRTransformerv2:
  num_layers: 4
  mgsa_groups: 3
  mgsa_mask_ratio: 0.1
  o2m_t: true
  num_queries_o2m: 450
  o2m_repeat: 4


epoches: 120

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.00005
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.00005
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001


train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: 117
  collate_fn:
    stop_epoch: 117
  total_batch_size: 4

val_dataloader:
  total_batch_size: 4
