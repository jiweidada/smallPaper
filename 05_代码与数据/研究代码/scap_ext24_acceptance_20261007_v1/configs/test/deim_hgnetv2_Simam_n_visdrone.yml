__include__: [
  '../dfine/dfine_hgnetv2_n_custom.yml',
  'visdrone2019_mpsma.yml',
  '../base/deim.yml',
]

print_freq: 400
output_dir: ./outputs/deim_hgnetv2_n_Simam_320

HGNetv2:
  agg: simam

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0004
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.0004
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0008
  betas: [0.9, 0.999]
  weight_decay: 0.0001

# Increase to search for the optimal ema
#epoches: 160 # 148 + 12
epoches: 320

## Our LR-Scheduler
#flat_epoch: 78    # 4 + epoch // 2, e.g., 40 = 4 + 72 / 2
#no_aug_epoch: 12
# 学习率调度器相关
flat_epoch: 164    # 按照注释公式：4 + 320 // 2 = 164
no_aug_epoch: 24   # 最后阶段不使用数据增强的轮数，建议也加倍
lr_gamma: 1.0

## Our DataAug
train_dataloader:
  dataset:
    transforms:
      policy:
#        epoch: [4, 78, 148]   # list
        epoch: [4, 156, 296]   # 原来是 [4, 78, 148]，按比例加倍

  collate_fn:
#    mixup_epochs: [4, 78]
    mixup_epochs: [4, 156]     # 原来是 [4, 78]，按比例加倍
#    stop_epoch: 148
    stop_epoch: 296            # 原来是 148，按比例加倍
    base_size_repeat: ~

  total_batch_size: 4

val_dataloader:
  total_batch_size: 4