__include__: [
  '../dfine/dfine_hgnetv2_n_custom.yml',
  'visdrone2019_mpsma.yml',
  '../base/deim.yml',
]

print_freq: 800
output_dir: ./outputs/deim_hgnetv2_EnhancedStemNO_NOMSCA_Silu_n_visdrone_320

DEIM:
  backbone: HGNetv2_Silu

HGNetv2_Silu:
  name: 'B0'
  return_idx: [2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True
  pretrained: False
  hierarchical_attention: False
  agg: [ 'ese', 'ese', 'ese', 'ese' ]
  act_type: 'silu'


optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0004
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.0004
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0008
  betas: [0.9, 0.999]
  weight_decay: 0.0001

# ========== Training Schedule ==========
epoches: 320

# 学习率调度
flat_epoch: 164          # warmup: 4 + 320 // 2 = 164
no_aug_epoch: 24         # 最后24轮不使用数据增强
lr_gamma: 1.0

# ========== Data Configuration ==========
train_dataloader:
  dataset:
    transforms:
      policy:
        # 训练阶段划分
        epoch: [4, 156, 296]  # warmup, main, fine-tuning

        # 针对小目标的特殊处理
        RandomCrop:
          size: [640, 640]    # 输入尺寸

        # Mosaic增强（对小目标友好）
        Mosaic:
          prob: 0.5


  collate_fn:
    mixup_epochs: [4, 156]    # Mixup增强的轮数
    stop_epoch: 296           # 停止增强的轮数
    base_size_repeat: ~

  total_batch_size: 4         # 根据GPU内存调整

val_dataloader:
  total_batch_size: 4
