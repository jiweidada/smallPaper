# 24-epoch screen schedule, scaled from the official 132-epoch VisDrone S schedule. Only schedule keys differ.
__include__: ['deim_hgnetv2_s_visdrone.yml']
epoches: 24
flat_epoch: 12
no_aug_epoch: 4
train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: [2, 12, 20]
  collate_fn:
    mixup_epochs: [2, 12]
    stop_epoch: 20
