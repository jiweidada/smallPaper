__include__: [
  '../../obb/dfine/dfine_hgnetv2_l.yml',
  './_base_ov_obb_dfine.yml'
]

output_dir: ./outputs/ov/dfine/ov_obb_dfine_hgnetv2_l_uavrob

model: OVDEIM
text_cache_file: text_embedding/tips_v2_uavrob_text_cache.pth

OVDEIM:
  backbone: HGNetv2
  encoder: HybridEncoder
  decoder: OVOBBDFINETransformer
  img_dim: 256
  text_dim: 768
  text_adapter_layers: 1

OVOBBDFINETransformer:
  feat_channels: [256, 256, 256]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  dim_feedforward: 1024
  num_levels: 3
  num_layers: 6
  eval_idx: -1
  num_queries: 300
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  num_points: [3, 6, 3]
  cross_attn_method: default
  query_select_method: default
  reg_max: 32
  reg_scale: 4
  layer_scale: 1
