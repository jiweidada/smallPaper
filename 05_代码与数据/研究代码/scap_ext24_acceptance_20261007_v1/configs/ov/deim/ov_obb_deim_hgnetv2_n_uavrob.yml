__include__: [
  '../../obb/deim/deim_hgnetv2_n.yml',
  './_base_ov_obb_deim.yml'
]

output_dir: ./outputs/ov/deim/ov_obb_deim_hgnetv2_n_uavrob

model: OVDEIM
text_cache_file: text_embedding/tips_v2_uavrob_text_cache.pth

OVDEIM:
  backbone: HGNetv2
  encoder: HybridEncoder
  decoder: OVOBBDFINETransformer
  img_dim: 128
  text_dim: 768
  text_adapter_layers: 1

OVOBBDFINETransformer:
  feat_channels: [128, 128]
  feat_strides: [16, 32]
  hidden_dim: 128
  dim_feedforward: 512
  num_levels: 2
  num_layers: 3
  eval_idx: -1
  num_queries: 300
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  num_points: [6, 6]
  cross_attn_method: default
  query_select_method: default
  reg_max: 32
  reg_scale: 4
  layer_scale: 1
