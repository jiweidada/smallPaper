backbone:
  - [-1, StemBlock, [16, 16, True]] # 0-P2/4
  - [-1, HG_Stage, [16, 64, 1, 3, False, False, 3, True, 'se']] # 1-P2/4
  - [-1, HG_Stage, [32, 256, 1, 3, True, False, 3, True, 'se']] # 2-P3/8
  - [-1, HG_Stage, [64, 512, 2, 3, True, True, 5, True, 'se']] # 3-P4/16
  - [-1, HG_Stage, [128, 1024, 1, 3, True, True, 5, True, 'se']] # 4-P5/32

encoder:
  - [2, ConvNormLayer_fuse, [256, 1, 1]] # 5-P3/8
  - [3, ConvNormLayer_fuse, [256, 1, 1]] # 6-P4/16
  - [4, ConvNormLayer_fuse, [256, 1, 1]] # 7-P5/32

  - [-1, TransformerEncoderBlock, [8, 1024, 0.1, "relu", 10000, False]] # 8-P5/32

  - [[6, 8], A3Fusion2, [0]] # 9-P4, 其中 0 是 level 索引，表示输出对齐到 channels[0]，也就是第一个输入分支 P4
  - [[6, 8], A3Fusion2, [1]] # 10-P5, 其中 1 是 level 索引，表示输出对齐到 channels[1]，也就是第二个输入分支 P5

  - [[5, 9, 10], A3Fusion3, [0]] # 11-P3/8, 其中 0 是 level 索引，表示输出对齐到 channels[0]，对应第一个输入分支 P3
  - [[5, 9, 10], A3Fusion3, [1]] # 12-P4/16, 其中 1 是 level 索引，表示输出对齐到 channels[1]，对应第二个输入分支 P4 seed
  - [[5, 9, 10], A3Fusion3, [2]] # 13-P5/32, 其中 2 是 level 索引，表示输出对齐到 channels[2]，对应第三个输入分支 P5 seed

  - [11, A3Conv, [256, 3, 1, 1]] # 14-P3/8
  - [12, A3Conv, [256, 3, 1, 1]] # 15-P4/16
  - [13, A3Conv, [256, 3, 1, 1]] # 16-P5/32

decoder:
  - [[14, 15, 16], DFINETransformer, {"feat_strides":[8, 16, 32], "hidden_dim": 256, "num_levels": 3, "num_layers": 3, "num_points": [3, 6, 3], "dim_feedforward": 1024}]
