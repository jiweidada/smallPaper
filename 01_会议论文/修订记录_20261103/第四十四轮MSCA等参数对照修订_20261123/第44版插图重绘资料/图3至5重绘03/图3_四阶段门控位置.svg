    <path d="M414 84 H450" stroke="#222729" fill="none" stroke-width="1.63" stroke-linecap="round" stroke-linejoin="round" id="stage2-stage3" data-from="simam" data-to="lite1" marker-end="url(#ink-tip)"/>
    <path d="M559 84 H595" stroke="#222729" fill="none" stroke-width="1.63" stroke-linecap="round" stroke-linejoin="round" id="block1-block2" data-from="lite1" data-to="lite2" marker-end="url(#ink-tip)"/>
