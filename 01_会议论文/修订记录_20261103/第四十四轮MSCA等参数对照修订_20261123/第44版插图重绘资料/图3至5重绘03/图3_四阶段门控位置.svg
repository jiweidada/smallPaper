<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="167.64mm" height="42.608500mm" viewBox="0 0 960 244" version="1.1" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Gate placement in the four HGNetv2-B0 stages</title>
  <desc id="fig-desc">A dark segment marks the gate at the end of each HG block. Stage 3 has two separate Lite gates, and only its second block has a residual connection. The lower cutaway shows input and intermediate HG features being concatenated, projected to the full stage width, then gated.</desc>
  <metadata>Revision 44, Figure 3. Scientific source: Figure 3 label sheet, B0 stage configuration, HG_Block.forward and HG_Stage in hgnetv2_MSCA_EnhancedStem.py. Layout informed by the author's 3.png and MSCA架构图1.png.. Paper figure references: local academic-diagram atlas, DrivoR Fig. 1 (continuous paths and inline notation), TabICL Fig. 2 (operator notation and residual wiring).</metadata>
