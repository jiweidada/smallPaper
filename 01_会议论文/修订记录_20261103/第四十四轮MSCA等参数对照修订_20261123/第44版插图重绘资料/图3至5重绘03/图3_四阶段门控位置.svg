    <marker id="ink-tip" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1.2 1.2 L9 5 L1.2 8.8 L2.75 5 Z" fill="#222729"/>
    </marker>
    <marker id="blue-tip" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1.2 1.2 L9 5 L1.2 8.8 L2.75 5 Z" fill="#235571"/>
    </marker>
    <marker id="rust-tip" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1.2 1.2 L9 5 L1.2 8.8 L2.75 5 Z" fill="#804422"/>
    </marker>
    <marker id="gray-tip" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1.2 1.2 L9 5 L1.2 8.8 L2.75 5 Z" fill="#535D62"/>
    </marker>
  </defs>
