<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="167.64mm" height="72.085200mm" viewBox="0 0 960 412.8" version="1.1" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">MPS branch alignment and spatial weighting</title>
  <desc id="fig-desc">Three branches share the image X. The main path is two 3 × 3 convolutions with strides 2 and 1. The detail path is two 3 × 3 stride-1 convolutions followed by 2 × 2 mean pooling at stride 2. The high-pass path subtracts the 3 × 3 local mean, applies pointwise and depthwise convolutions, then bilinear resizes. The widths of the three strips represent 16, 8 and 4 channels. The gate A(Z) scales the concatenated tensor as Z times one plus A(Z).</desc>
  <metadata>Revision 44, Figure 2. Scientific source: EnhancedStemBlock.py and manuscript section 3.2. Paper figure references: local academic-diagram atlas, DrivoR Fig. 1 (continuous paths and inline notation), TabICL Fig. 2 (operator notation and residual wiring).</metadata>
  <defs>
    <marker id="ink-tip" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1.2 1.2 L9 5 L1.2 8.8 L2.75 5 Z" fill="#222729"/>
    </marker>
    <marker id="blue-tip" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1.2 1.2 L9 5 L1.2 8.8 L2.75 5 Z" fill="#235571"/>
    </marker>
    <marker id="rust-tip" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1.2 1.2 L9 5 L1.2 8.8 L2.75 5 Z" fill="#804422"/>
    </marker>
    <marker id="gray-tip" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1.2 1.2 L9 5 L1.2 8.8 L2.75 5 Z" fill="#535D62"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="412.8" fill="#FFFFFF"/>
  <g id="edges" inkscape:label="Arrows and junctions">
    <path d="M79 129 H124" stroke="#222729" fill="none" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M124 62 V196" stroke="#222729" fill="none" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="124" cy="129" r="2.8" fill="#222729"/>
    <path d="M124 62 H253" stroke="#222729" fill="none" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" id="main-into-1" data-from="input" data-to="main-op-1" marker-end="url(#ink-tip)"/>
    <path d="M340 62 H382" stroke="#222729" fill="none" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" id="main-into-2" data-from="main-op-1" data-to="main-op-2" marker-end="url(#ink-tip)"/>
    <path d="M469 62 H667" stroke="#222729" fill="none" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" id="main-strip-in" data-from="main-op-2" data-to="main-strip" marker-end="url(#ink-tip)"/>
    <path d="M124 129 H253" stroke="#222729" fill="none" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" id="detail-into-1" data-from="input" data-to="detail-op-1" marker-end="url(#ink-tip)"/>
    <path d="M373 129 H413" stroke="#222729" fill="none" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" id="detail-into-2" data-from="detail-op-1" data-to="detail-op-2" marker-end="url(#ink-tip)"/>
    <path d="M535 129 H667" stroke="#222729" fill="none" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" id="detail-strip-in" data-from="detail-op-2" data-to="detail-strip" marker-end="url(#ink-tip)"/>
    <path d="M124 196 H226" stroke="#222729" fill="none" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" id="high-into-1" data-from="input" data-to="high-op-1" marker-end="url(#ink-tip)"/>
    <path d="M349 196 H369" stroke="#222729" fill="none" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" id="high-into-2" data-from="high-op-1" data-to="high-op-2" marker-end="url(#ink-tip)"/>
    <path d="M434 196 H458" stroke="#222729" fill="none" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" id="high-into-3" data-from="high-op-2" data-to="high-op-3" marker-end="url(#ink-tip)"/>
    <path d="M533 196 H557" stroke="#222729" fill="none" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" id="high-into-4" data-from="high-op-3" data-to="high-op-4" marker-end="url(#ink-tip)"/>
    <path d="M644 196 H667" stroke="#222729" fill="none" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" id="high-strip-in" data-from="high-op-4" data-to="high-strip" marker-end="url(#ink-tip)"/>
    <path d="M862 127 H889" stroke="#222729" fill="none" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" id="concat-out" data-from="concat" data-to="z-top" marker-end="url(#ink-tip)"/>
    <path d="M79 349 H129" stroke="#222729" fill="none" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="129" cy="349" r="2.8" fill="#222729"/>
    <path d="M129 349 H453.75" stroke="#222729" fill="none" stroke-width="1.68" stroke-linecap="round" stroke-linejoin="round" id="value-to-product" data-from="z" data-to="multiply" marker-end="url(#ink-tip)"/>
    <path d="M129 349 V302 H183" stroke="#222729" fill="none" stroke-width="1.68" stroke-linecap="round" stroke-linejoin="round" id="gate-from-z" data-from="z" data-to="gate" marker-end="url(#ink-tip)"/>
    <path d="M368 302 H410" stroke="#235571" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" id="add-one" data-from="gate" data-to="plus-one" marker-end="url(#blue-tip)"/>
    <path d="M465 318 V337.75" stroke="#235571" fill="none" stroke-width="1.68" stroke-linecap="round" stroke-linejoin="round" id="gate-to-product" data-from="plus-one" data-to="multiply" marker-end="url(#blue-tip)"/>
    <path d="M476.25 349 H517" stroke="#222729" fill="none" stroke-width="1.68" stroke-linecap="round" stroke-linejoin="round" id="to-fusion1" data-from="multiply" data-to="fusion-1" marker-end="url(#ink-tip)"/>
    <path d="M580 349 H620" stroke="#222729" fill="none" stroke-width="1.68" stroke-linecap="round" stroke-linejoin="round" id="fusion-changed" data-from="fusion-1" data-to="fusion-2" marker-end="url(#ink-tip)"/>
    <path d="M683 349 H731" stroke="#222729" fill="none" stroke-width="1.68" stroke-linecap="round" stroke-linejoin="round" id="to-downsample" data-from="fusion-2" data-to="downsample" marker-end="url(#ink-tip)"/>
    <path d="M808 349 H850" stroke="#222729" fill="none" stroke-width="1.68" stroke-linecap="round" stroke-linejoin="round" id="to-output" data-from="downsample" data-to="output" marker-end="url(#ink-tip)"/>
  </g>
  <g id="branches" inkscape:label="Three branches aligned before concatenation">
    <text x="20" y="28" font-size="18.6" text-anchor="start" fill="#222729" font-family="Arial, Helvetica, sans-serif" font-weight="bold">(a)  Branches</text>
    <g id="input" inkscape:label="Input tensor">
      <text x="58" y="137" font-size="29" text-anchor="middle" fill="#222729" font-family="Cambria, Times New Roman, serif" font-weight="normal" font-style="italic">X</text>
      <text x="58" y="167" font-size="16" text-anchor="middle" fill="#535D62" font-family="Arial, Helvetica, sans-serif" font-weight="normal">3 × 640 × 640</text>
    </g>
    <g id="main" inkscape:label="Main">
      <text x="141" y="51" font-size="17.1" text-anchor="start" fill="#222729" font-family="Arial, Helvetica, sans-serif" font-weight="bold">Main</text>
      <g id="main-op-1" inkscape:label="3 × 3 conv">
        <rect x="253" y="46" width="87" height="32" fill="#FFFFFF" stroke="#737F84" stroke-width="1.08"/>
        <text x="296.5" y="68" font-size="16.8" text-anchor="middle" fill="#222729" font-family="Arial, Helvetica, sans-serif" font-weight="normal">3 × 3 conv</text>
        <text x="296.5" y="96" font-size="15.4" text-anchor="middle" fill="#535D62" font-family="Arial, Helvetica, sans-serif" font-weight="normal">stride 2</text>
      </g>
      <g id="main-op-2" inkscape:label="3 × 3 conv">
        <rect x="382" y="46" width="87" height="32" fill="#FFFFFF" stroke="#737F84" stroke-width="1.08"/>
        <text x="425.5" y="68" font-size="16.8" text-anchor="middle" fill="#222729" font-family="Arial, Helvetica, sans-serif" font-weight="normal">3 × 3 conv</text>
        <text x="425.5" y="96" font-size="15.4" text-anchor="middle" fill="#535D62" font-family="Arial, Helvetica, sans-serif" font-weight="normal">stride 1</text>
      </g>
      <g id="main-strip" inkscape:label="16 aligned channels of Z">
        <path d="M667 46 H695 C754 46 774 97 820 97 H862 V129 H820 C774 129 754 78 695 78 H667 Z" fill="#315E78" data-to="concat" data-channels="16"/>
        <text x="681" y="38" font-size="15.9" text-anchor="middle" fill="#235571" font-family="Arial, Helvetica, sans-serif" font-weight="normal">16 ch</text>
      </g>
    </g>
    <g id="detail" inkscape:label="Detail">
      <text x="141" y="118" font-size="17.1" text-anchor="start" fill="#222729" font-family="Arial, Helvetica, sans-serif" font-weight="bold">Detail</text>
      <g id="detail-op-1" inkscape:label="3 × 3 conv × 2">
        <rect x="253" y="113" width="120" height="32" fill="#FFFFFF" stroke="#737F84" stroke-width="1.08"/>
        <text x="313.0" y="135" font-size="16.8" text-anchor="middle" fill="#222729" font-family="Arial, Helvetica, sans-serif" font-weight="normal">3 × 3 conv × 2</text>
        <text x="313.0" y="163" font-size="15.4" text-anchor="middle" fill="#535D62" font-family="Arial, Helvetica, sans-serif" font-weight="normal">stride 1</text>
      </g>
      <g id="detail-op-2" inkscape:label="AvgPool 2 × 2">
        <rect x="413" y="113" width="122" height="32" fill="#EDF3F7" stroke="#737F84" stroke-width="1.08"/>
        <text x="474.0" y="135" font-size="16.8" text-anchor="middle" fill="#222729" font-family="Arial, Helvetica, sans-serif" font-weight="normal">AvgPool 2 × 2</text>
        <text x="474.0" y="163" font-size="15.4" text-anchor="middle" fill="#535D62" font-family="Arial, Helvetica, sans-serif" font-weight="normal">stride 2</text>
      </g>
      <g id="detail-strip" inkscape:label="8 aligned channels of Z">
        <path d="M667 121 H695 C754 121 774 129 820 129 H862 V145 H820 C774 145 754 137 695 137 H667 Z" fill="#668BA1" data-to="concat" data-channels="8"/>
        <text x="681" y="113" font-size="15.9" text-anchor="middle" fill="#235571" font-family="Arial, Helvetica, sans-serif" font-weight="normal">8 ch</text>
      </g>
    </g>
    <g id="high" inkscape:label="High-pass">
      <text x="141" y="185" font-size="17.1" text-anchor="start" fill="#222729" font-family="Arial, Helvetica, sans-serif" font-weight="bold">High-pass</text>
      <g id="high-op-1" inkscape:label="X − AvgPool₃(X)">
        <rect x="226" y="180" width="123" height="32" fill="#FFFFFF" stroke="#737F84" stroke-width="1.08"/>
        <text x="287.5" y="202" font-size="15.4" text-anchor="middle" fill="#222729" font-family="Arial, Helvetica, sans-serif" font-weight="normal">X − AvgPool₃(X)</text>
      </g>
      <g id="high-op-2" inkscape:label="1 × 1">
        <rect x="369" y="180" width="65" height="32" fill="#FFFFFF" stroke="#737F84" stroke-width="1.08"/>
        <text x="401.5" y="202" font-size="16.8" text-anchor="middle" fill="#222729" font-family="Arial, Helvetica, sans-serif" font-weight="normal">1 × 1</text>
      </g>
      <g id="high-op-3" inkscape:label="DW 3 × 3">
        <rect x="458" y="180" width="75" height="32" fill="#FFFFFF" stroke="#737F84" stroke-width="1.08"/>
        <text x="495.5" y="202" font-size="16.8" text-anchor="middle" fill="#222729" font-family="Arial, Helvetica, sans-serif" font-weight="normal">DW 3 × 3</text>
      </g>
      <g id="high-op-4" inkscape:label="Bilinear ↓">
        <rect x="557" y="180" width="87" height="32" fill="#EDF3F7" stroke="#737F84" stroke-width="1.08"/>
        <text x="600.5" y="202" font-size="16.8" text-anchor="middle" fill="#222729" font-family="Arial, Helvetica, sans-serif" font-weight="normal">Bilinear ↓</text>
      </g>
      <g id="high-strip" inkscape:label="4 aligned channels of Z">
        <path d="M667 192 H695 C754 192 774 145 820 145 H862 V153 H820 C774 153 754 200 695 200 H667 Z" fill="#9DB5C4" data-to="concat" data-channels="4"/>
        <text x="681" y="184" font-size="15.9" text-anchor="middle" fill="#235571" font-family="Arial, Helvetica, sans-serif" font-weight="normal">4 ch</text>
      </g>
    </g>
    <g id="concat" inkscape:label="Channel concatenation ordered main, detail, high-pass">
      <text x="840" y="81" font-size="17.2" text-anchor="middle" fill="#222729" font-family="Arial, Helvetica, sans-serif" font-weight="normal">Concat</text>
      <text x="940" y="203" font-size="16.3" text-anchor="end" fill="#535D62" font-family="Arial, Helvetica, sans-serif" font-weight="normal">28 × 320 × 320</text>
    </g>
    <g id="z-top" inkscape:label="Concatenated feature">
      <text x="916" y="140" font-size="24" text-anchor="middle" fill="#235571" font-family="Cambria, Times New Roman, serif" font-weight="normal" font-style="italic">Z</text>
    </g>
    <text x="496" y="227" font-size="14.9" text-anchor="middle" fill="#535D62" font-family="Arial, Helvetica, sans-serif" font-weight="normal">DW = depthwise</text>
  </g>
  <path d="M20 232 H940" stroke="#ACB5B8" fill="none" stroke-width="1.05" stroke-linecap="round" stroke-linejoin="round"/>
  <g id="weighting" inkscape:label="Residual weighting and fusion">
    <text x="20" y="260" font-size="18.6" text-anchor="start" fill="#222729" font-family="Arial, Helvetica, sans-serif" font-weight="bold">(b)  Weighting and fusion</text>
    <g id="z" inkscape:label="Z from panel a">
      <text x="58" y="356" font-size="28" text-anchor="middle" fill="#222729" font-family="Cambria, Times New Roman, serif" font-weight="normal" font-style="italic">Z</text>
    </g>
    <g id="gate" inkscape:label="Spatial gating of the concatenated feature">
      <rect x="183" y="276" width="185" height="52" fill="#FFFFFF" stroke="#737F84" stroke-width="1.12"/>
      <text x="275.5" y="297" font-size="17.9" text-anchor="middle" fill="#222729" font-family="Arial, Helvetica, sans-serif" font-weight="bold">Spatial gate</text>
      <text x="275.5" y="318" font-size="16.1" text-anchor="middle" fill="#535D62" font-family="Arial, Helvetica, sans-serif" font-weight="normal">1×1 → 7×7 → sigmoid</text>
    </g>
    <text x="421" y="288" font-size="15.4" text-anchor="start" fill="#535D62" font-family="Arial, Helvetica, sans-serif" font-weight="normal">1 × 320 × 320</text>
    <g id="plus-one" inkscape:label="One plus the single-channel spatial gate">
      <text x="465" y="310" font-size="21.5" text-anchor="middle" fill="#235571" font-family="Cambria, Times New Roman, serif" font-weight="normal" font-style="italic">1 + A(Z)</text>
    </g>
    <g id="multiply" inkscape:label="Elementwise multiplication">
      <circle cx="465" cy="349" r="11.25" fill="#FFFFFF" stroke="#222729" stroke-width="1.6"/>
      <circle cx="465" cy="349" r="2.7" fill="#222729"/>
    </g>
    <text x="502" y="389" font-size="21" text-anchor="end" fill="#235571" font-family="Cambria, Times New Roman, serif" font-weight="normal" font-style="italic">Z ⊙ [1 + A(Z)]</text>
    <text x="600" y="318" font-size="17.7" text-anchor="middle" fill="#222729" font-family="Arial, Helvetica, sans-serif" font-weight="bold">Fusion</text>
    <g id="fusion-1" inkscape:label="1 × 1">
      <rect x="517" y="333" width="63" height="32" fill="#FFFFFF" stroke="#737F84" stroke-width="1.08"/>
      <text x="548.5" y="355" font-size="16.8" text-anchor="middle" fill="#222729" font-family="Arial, Helvetica, sans-serif" font-weight="normal">1 × 1</text>
      <text x="548.5" y="383" font-size="15.4" text-anchor="middle" fill="#535D62" font-family="Arial, Helvetica, sans-serif" font-weight="normal">28 → 32</text>
    </g>
    <g id="fusion-2" inkscape:label="3 × 3">
      <rect x="620" y="333" width="63" height="32" fill="#FFFFFF" stroke="#737F84" stroke-width="1.08"/>
      <text x="651.5" y="355" font-size="16.8" text-anchor="middle" fill="#222729" font-family="Arial, Helvetica, sans-serif" font-weight="normal">3 × 3</text>
      <text x="651.5" y="383" font-size="15.4" text-anchor="middle" fill="#535D62" font-family="Arial, Helvetica, sans-serif" font-weight="normal">32 → 16</text>
    </g>
    <g id="downsample" inkscape:label="3 × 3">
      <rect x="731" y="333" width="77" height="32" fill="#EDF3F7" stroke="#737F84" stroke-width="1.08"/>
      <text x="769.5" y="355" font-size="16.8" text-anchor="middle" fill="#222729" font-family="Arial, Helvetica, sans-serif" font-weight="normal">3 × 3</text>
      <text x="769.5" y="383" font-size="15.4" text-anchor="middle" fill="#535D62" font-family="Arial, Helvetica, sans-serif" font-weight="normal">stride 2</text>
    </g>
    <g id="output" inkscape:label="Stem output at stride four">
      <rect x="863" y="325" width="37" height="26" fill="#D6E3EA" stroke="#235571" stroke-width="1.03"/>
      <rect x="858" y="330" width="37" height="26" fill="#C0D2DD" stroke="#235571" stroke-width="1.03"/>
      <rect x="852" y="336" width="37" height="26" fill="#96B2C3" stroke="#235571" stroke-width="1.03"/>
      <text x="886" y="385" font-size="16.5" text-anchor="middle" fill="#535D62" font-family="Arial, Helvetica, sans-serif" font-weight="normal">16 × 160 × 160</text>
    </g>
  </g>
</svg>
