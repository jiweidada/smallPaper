<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="167.64mm" height="38.557200mm" viewBox="0 0 960 220.8" version="1.1" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Gate placement by backbone stage</title>
  <desc id="fig-desc">The gate matrix shows four B0 stages, their output channels and feature strides. Each cell contains the actual gate sequence in that stage. The Stage 3 cell shows two separate MSCA-Lite blocks and the residual around the second block.</desc>
  <metadata>Revision 44, Figure 3. Scientific source: HG_Block, HG_Stage, B0 configuration in hgnetv2_MSCA_EnhancedStem.py, FULL_FRESH.yml, manuscript section 3.3. Paper figure references: local academic-diagram atlas, DrivoR Fig. 1 (continuous paths and inline notation), TabICL Fig. 2 (operator notation and residual wiring).</metadata>
  <defs>
    <marker id="ink-tip" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1.2 1.2 L9 5 L1.2 8.8 L2.75 5 Z" fill="#222729"/>
    </marker>
    <marker id="blue-tip" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1.2 1.2 L9 5 L1.2 8.8 L2.75 5 Z" fill="#235571"/>
    </marker>
    <marker id="rust-tip" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1.2 1.2 L9 5 L1.2 8.8 L2.75 5 Z" fill="#804422"/>
    </marker>
    <marker id="gray-tip" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1.2 1.2 L9 5 L1.2 8.8 L2.75 5 Z" fill="#535D62"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="220.8" fill="#FFFFFF"/>
  <g id="edges" inkscape:label="Arrows and junctions"/>
  <g id="stage-matrix" inkscape:label="Four stages and their gates">
    <rect x="416" y="10" width="338" height="148" fill="#EFF4F7"/>
    <path d="M19 39 H942 M19 73 H942 M19 158 H942" stroke="#ACB5B8" fill="none" stroke-width="1.05" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M134 10 V158 M277 10 V158 M416 10 V158 M754 10 V158" stroke="#ACB5B8" fill="none" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="20" y="29" font-size="16.7" text-anchor="start" fill="#535D62" font-family="Arial, Helvetica, sans-serif" font-weight="normal">Stage</text>
    <text x="20" y="61" font-size="16.7" text-anchor="start" fill="#535D62" font-family="Arial, Helvetica, sans-serif" font-weight="normal">Output</text>
    <text x="20" y="114" font-size="16.7" text-anchor="start" fill="#535D62" font-family="Arial, Helvetica, sans-serif" font-weight="normal">Gate per block</text>
    <text x="205" y="29" font-size="20.5" text-anchor="middle" fill="#222729" font-family="Arial, Helvetica, sans-serif" font-weight="bold">1</text>
    <text x="205" y="61" font-size="16.4" text-anchor="middle" fill="#535D62" font-family="Arial, Helvetica, sans-serif" font-weight="normal">64 ch · stride 4</text>
    <text x="346" y="29" font-size="20.5" text-anchor="middle" fill="#222729" font-family="Arial, Helvetica, sans-serif" font-weight="bold">2</text>
    <text x="346" y="61" font-size="16.4" text-anchor="middle" fill="#535D62" font-family="Arial, Helvetica, sans-serif" font-weight="normal">256 ch · stride 8</text>
    <text x="585" y="29" font-size="20.5" text-anchor="middle" fill="#222729" font-family="Arial, Helvetica, sans-serif" font-weight="bold">3</text>
    <text x="585" y="61" font-size="16.4" text-anchor="middle" fill="#535D62" font-family="Arial, Helvetica, sans-serif" font-weight="normal">512 ch · stride 16</text>
    <text x="851" y="29" font-size="20.5" text-anchor="middle" fill="#222729" font-family="Arial, Helvetica, sans-serif" font-weight="bold">4</text>
    <text x="851" y="61" font-size="16.4" text-anchor="middle" fill="#535D62" font-family="Arial, Helvetica, sans-serif" font-weight="normal">1024 ch · stride 32</text>
    <g id="ese" inkscape:label="One HG block with ESE">
      <text x="205" y="117" font-size="19.4" text-anchor="middle" fill="#222729" font-family="Arial, Helvetica, sans-serif" font-weight="normal">ESE</text>
    </g>
    <g id="simam" inkscape:label="One HG block with SimAM">
      <text x="346" y="117" font-size="19.4" text-anchor="middle" fill="#222729" font-family="Arial, Helvetica, sans-serif" font-weight="normal">SimAM</text>
    </g>
    <g id="dilated" inkscape:label="One HG block with MSCA-Dilated">
      <text x="851" y="117" font-size="19.4" text-anchor="middle" fill="#222729" font-family="Arial, Helvetica, sans-serif" font-weight="normal">MSCA-Dilated</text>
    </g>
    <g id="lite-1" inkscape:label="MSCA-Lite at block 1">
      <text x="482" y="94" font-size="15.4" text-anchor="middle" fill="#535D62" font-family="Arial, Helvetica, sans-serif" font-weight="normal">Block 1</text>
      <text x="482" y="117" font-size="18.2" text-anchor="middle" fill="#235571" font-family="Arial, Helvetica, sans-serif" font-weight="normal">MSCA-Lite</text>
    </g>
    <g id="lite-2" inkscape:label="MSCA-Lite at block 2">
      <text x="619" y="94" font-size="15.4" text-anchor="middle" fill="#535D62" font-family="Arial, Helvetica, sans-serif" font-weight="normal">Block 2</text>
      <text x="619" y="117" font-size="18.2" text-anchor="middle" fill="#235571" font-family="Arial, Helvetica, sans-serif" font-weight="normal">MSCA-Lite</text>
    </g>
  </g>
  <g id="stage3-residual" inkscape:label="Second-block residual inside Stage 3">
    <path d="M531 110 H574" stroke="#235571" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" id="lite1-to-lite2" data-from="lite-1" data-to="lite-2" marker-end="url(#blue-tip)"/>
    <circle cx="550" cy="110" r="2.8" fill="#235571"/>
    <path d="M667 110 H706.75" stroke="#235571" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" id="lite2-to-plus" data-from="lite-2" data-to="sum" marker-end="url(#blue-tip)"/>
    <path d="M550 110 V147 H718 V121.25" stroke="#235571" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" id="lite2-bypass" data-from="lite-1" data-to="sum" marker-end="url(#blue-tip)"/>
  </g>
  <g id="sum" inkscape:label="Residual addition">
    <circle cx="718" cy="110" r="11.25" fill="#FFFFFF" stroke="#222729" stroke-width="1.6"/>
    <path d="M713.5 110 h9 M718 105.5 v9" stroke="#222729" fill="none" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="637" y="139" font-size="15.4" text-anchor="middle" fill="#235571" font-family="Arial, Helvetica, sans-serif" font-weight="normal">Residual</text>
  <g id="hg-block" inkscape:label="Operation order in each HG block">
    <text x="20" y="194" font-size="17.4" text-anchor="start" fill="#222729" font-family="Arial, Helvetica, sans-serif" font-weight="bold">Within each HG block</text>
    <g id="concat" inkscape:label="Concat">
      <text x="300" y="191" font-size="19" text-anchor="middle" fill="#222729" font-family="Arial, Helvetica, sans-serif" font-weight="normal">Concat</text>
      <text x="300" y="212" font-size="15.5" text-anchor="middle" fill="#535D62" font-family="Arial, Helvetica, sans-serif" font-weight="normal">input and layer outputs</text>
    </g>
    <g id="projection" inkscape:label="1 × 1 ConvBNAct">
      <text x="574" y="191" font-size="19" text-anchor="middle" fill="#222729" font-family="Arial, Helvetica, sans-serif" font-weight="normal">1 × 1 ConvBNAct</text>
      <text x="574" y="212" font-size="15.5" text-anchor="middle" fill="#535D62" font-family="Arial, Helvetica, sans-serif" font-weight="normal">full stage width</text>
    </g>
    <g id="gate" inkscape:label="Stage gate">
      <text x="831" y="198" font-size="19" text-anchor="middle" fill="#235571" font-family="Arial, Helvetica, sans-serif" font-weight="normal">Stage gate</text>
    </g>
    <path d="M407 194 H477" stroke="#222729" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" id="cat-proj" data-from="concat" data-to="projection" marker-end="url(#ink-tip)"/>
    <path d="M672 194 H756" stroke="#222729" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" id="proj-gate" data-from="projection" data-to="gate" marker-end="url(#ink-tip)"/>
  </g>
</svg>
