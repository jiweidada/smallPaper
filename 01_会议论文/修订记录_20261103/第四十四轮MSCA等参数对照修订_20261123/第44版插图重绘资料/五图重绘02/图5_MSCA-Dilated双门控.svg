<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="167.64mm" height="70.408800mm" viewBox="0 0 960 403.2" version="1.1" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Spatial and channel weighting in MSCA-Dilated</title>
  <desc id="fig-desc">The context branch applies independent dilated convolutions at rates 1, 2 and 4. Its concatenated, projected context supplies the energy-based spatial gate. The channel gate takes the original feature F through global average pooling, two pointwise convolutions and sigmoid. The product combines the original F with both gates.</desc>
  <metadata>Revision 44, Figure 5. Scientific source: MSCA_Dilated.py, Figure 5 label sheet, and equations (2)–(4) of the manuscript. Paper figure references: local academic-diagram atlas, DrivoR Fig. 1 (continuous paths and inline notation), TabICL Fig. 2 (operator notation and residual wiring).</metadata>
