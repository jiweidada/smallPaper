<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="167.64mm" height="49.593500mm" viewBox="0 0 960 284" version="1.1" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Stage gates and HG block aggregation</title>
  <desc id="fig-desc">The left panel maps ESE, SimAM, two MSCA-Lite gates and MSCA-Dilated to the four B0 stages. The second Lite block receives the one residual branch. The right panel expands the shared aggregation path: the block input and each of the three layer outputs are concatenated, projected to the full stage width and passed through the stage gate.</desc>
  <metadata>Revision 44, Figure 3. Scientific source: HG_Block, HG_Stage and B0 configuration in hgnetv2_MSCA_EnhancedStem.py, revision 44 section 3.3. Layout reference: TabICL, ICML 2025, Fig. 2, for making residual and aggregate edges visible. Native SVG drawing. Monochrome composition proof.</metadata>
