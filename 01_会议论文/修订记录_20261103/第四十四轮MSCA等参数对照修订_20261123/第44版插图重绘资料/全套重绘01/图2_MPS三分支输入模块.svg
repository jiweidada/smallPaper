    <rect x="37.0" y="325.88" width="36" height="36" fill="#C7DDDF"/>
    <path d="M46.00 325.88 V361.88 M37.0 334.88 H73.0 M55.00 325.88 V361.88 M37.0 343.88 H73.0 M64.00 325.88 V361.88 M37.0 352.88 H73.0" stroke="#93B6BC" fill="none" stroke-width="0.85" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M77.20 323.86 V359.86" stroke="#678F99" fill="none" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>
