    <text x="61" y="301" fill="#172E3A" font-family="Arial, Helvetica, sans-serif" font-size="19.5" text-anchor="middle" font-weight="bold">Output</text>
    <text x="61" y="394" fill="#405968" font-family="Arial, Helvetica, sans-serif" font-size="15.8" text-anchor="middle" font-weight="normal">16 × 160 × 160</text>
  </g>
  <g id="main" inkscape:label="Main branch">
    <rect x="141" y="18" width="337" height="69" fill="#E9EEF4" stroke="#75899B" stroke-width="1.4" rx="3"/>
    <text x="154" y="40" fill="#172E3A" font-family="Arial, Helvetica, sans-serif" font-size="19" text-anchor="start" font-weight="bold">Main branch</text>
    <text x="465" y="39" fill="#405968" font-family="Arial, Helvetica, sans-serif" font-size="15.8" text-anchor="end" font-weight="normal">16 channels</text>
    <text x="154" y="70" fill="#405968" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="start" font-weight="normal">3 × 3 conv (stride 2) → 3 × 3 conv (stride 1)</text>
  </g>
  <g id="detail" inkscape:label="Detail branch">
    <rect x="141" y="99" width="337" height="79" fill="#E9EEF4" stroke="#75899B" stroke-width="1.4" rx="3"/>
    <text x="154" y="121" fill="#172E3A" font-family="Arial, Helvetica, sans-serif" font-size="19" text-anchor="start" font-weight="bold">Detail branch</text>
    <text x="465" y="120" fill="#405968" font-family="Arial, Helvetica, sans-serif" font-size="15.8" text-anchor="end" font-weight="normal">8 channels</text>
    <text x="154" y="145" fill="#405968" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="start" font-weight="normal">Two 3 × 3 convs (stride 1)</text>
    <text x="154" y="166" fill="#405968" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="start" font-weight="normal">2 × 2 average pooling (stride 2)</text>
  </g>
  <g id="highpass" inkscape:label="High-pass branch">
    <rect x="141" y="190" width="337" height="79" fill="#E9EEF4" stroke="#75899B" stroke-width="1.4" rx="3"/>
    <text x="154" y="212" fill="#172E3A" font-family="Arial, Helvetica, sans-serif" font-size="19" text-anchor="start" font-weight="bold">High-pass branch</text>
    <text x="465" y="211" fill="#405968" font-family="Arial, Helvetica, sans-serif" font-size="15.8" text-anchor="end" font-weight="normal">4 channels</text>
    <text x="154" y="236" fill="#405968" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="start" font-weight="normal" xml:space="preserve">X − AvgPool<tspan font-size="12.16" dy="3.52">3×3</tspan><tspan dy="-3.52">(X) → 1 × 1 conv</tspan></text>
    <text x="154" y="257" fill="#405968" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="start" font-weight="normal">3 × 3 depthwise conv → bilinear resize</text>
  </g>
  <g id="concat" inkscape:label="Channel concatenation">
    <rect x="539" y="77" width="129" height="123" fill="#E8F2EF" stroke="#5C827D" stroke-width="1.45" rx="3"/>
    <text x="603.5" y="104" fill="#265F64" font-family="Arial, Helvetica, sans-serif" font-size="18.3" text-anchor="middle" font-weight="bold">Concatenate</text>
    <rect x="562" y="119" width="47.42857142857143" height="11" fill="#648D99"/>
    <rect x="609.4285714285714" y="119" width="23.714285714285715" height="11" fill="#92B2BB"/>
    <rect x="633.1428571428571" y="119" width="11.857142857142858" height="11" fill="#BED1D4"/>
    <rect x="562" y="119" width="83" height="11" fill="none" stroke="#668990" stroke-width="0.8"/>
    <text x="603.5" y="157" fill="#265F64" font-family="Arial, Helvetica, sans-serif" font-size="21" text-anchor="middle" font-weight="bold" font-style="italic">Z</text>
    <text x="603.5" y="183" fill="#405968" font-family="Arial, Helvetica, sans-serif" font-size="15.7" text-anchor="middle" font-weight="normal">28 × 320 × 320</text>
  </g>
  <g id="gate" inkscape:label="Spatial gate">
    <rect x="717" y="46" width="225" height="176" fill="#E8F2EF" stroke="#5C827D" stroke-width="1.45" rx="4"/>
    <text x="829.5" y="73" fill="#265F64" font-family="Arial, Helvetica, sans-serif" font-size="19.7" text-anchor="middle" font-weight="bold">Spatial gate A(Z)</text>
    <path d="M731 84 H928" stroke="#A8C1BB" fill="none" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="829.5" y="107" fill="#172E3A" font-family="Arial, Helvetica, sans-serif" font-size="16.6" text-anchor="middle" font-weight="normal">1 × 1 conv (28 → 2)</text>
    <text x="829.5" y="131" fill="#172E3A" font-family="Arial, Helvetica, sans-serif" font-size="16.6" text-anchor="middle" font-weight="normal">BN → SiLU</text>
    <text x="829.5" y="155" fill="#172E3A" font-family="Arial, Helvetica, sans-serif" font-size="16.6" text-anchor="middle" font-weight="normal">7 × 7 conv (2 → 1)</text>
    <text x="829.5" y="179" fill="#172E3A" font-family="Arial, Helvetica, sans-serif" font-size="16.6" text-anchor="middle" font-weight="normal">sigmoid</text>
    <text x="829.5" y="209" fill="#405968" font-family="Arial, Helvetica, sans-serif" font-size="15.8" text-anchor="middle" font-weight="normal">1 × 320 × 320</text>
  </g>
  <text x="679" y="260" fill="#405968" font-family="Arial, Helvetica, sans-serif" font-size="17.5" text-anchor="end" font-weight="bold" font-style="italic">Z</text>
  <text x="848" y="260" fill="#265F64" font-family="Arial, Helvetica, sans-serif" font-size="17.5" text-anchor="start" font-weight="bold">A(Z)</text>
  <g id="weighting" inkscape:label="weighting">
    <rect x="658" y="298" width="284" height="86" fill="#E8F2EF" stroke="#5C827D" stroke-width="1.45" rx="3"/>
    <text x="800.0" y="329" fill="#265F64" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" font-weight="bold">Residual weighting</text>
    <text x="800.0" y="360" fill="#405968" font-family="Arial, Helvetica, sans-serif" font-size="21" text-anchor="middle" font-weight="normal">Z ⊙ (1 + A(Z))</text>
    <desc>The single-channel spatial weight broadcasts across all 28 concatenated channels.</desc>
  </g>
  <g id="fusion" inkscape:label="fusion">
    <rect x="367" y="299" width="247" height="84" fill="#E9EEF4" stroke="#75899B" stroke-width="1.45" rx="3"/>
    <text x="490.5" y="322" fill="#172E3A" font-family="Arial, Helvetica, sans-serif" font-size="19.5" text-anchor="middle" font-weight="bold">Fusion</text>
    <text x="490.5" y="346" fill="#405968" font-family="Arial, Helvetica, sans-serif" font-size="16.5" text-anchor="middle" font-weight="normal">1 × 1 conv (28 → 32)</text>
    <text x="490.5" y="370" fill="#405968" font-family="Arial, Helvetica, sans-serif" font-size="16.5" text-anchor="middle" font-weight="normal">3 × 3 conv (32 → 16)</text>
  </g>
  <g id="downsample" inkscape:label="downsample">
    <rect x="144" y="299" width="178" height="84" fill="#E9EEF4" stroke="#75899B" stroke-width="1.45" rx="3"/>
    <text x="233.0" y="322" fill="#172E3A" font-family="Arial, Helvetica, sans-serif" font-size="19.5" text-anchor="middle" font-weight="bold">Downsampling</text>
    <text x="233.0" y="346" fill="#405968" font-family="Arial, Helvetica, sans-serif" font-size="16.3" text-anchor="middle" font-weight="normal">3 × 3 conv (16 → 16)</text>
    <text x="233.0" y="370" fill="#405968" font-family="Arial, Helvetica, sans-serif" font-size="16.5" text-anchor="middle" font-weight="normal">stride 2</text>
  </g>
</svg>
