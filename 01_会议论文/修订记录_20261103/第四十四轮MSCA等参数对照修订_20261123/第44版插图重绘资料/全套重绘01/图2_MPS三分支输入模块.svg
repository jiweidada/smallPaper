<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="167.64mm" height="72.08520mm" viewBox="0 0 960 412.8" version="1.1" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Multi-branch progressive stem</title>
  <desc id="fig-desc">The image feeds three parallel branches. Their aligned 16-, 8- and 4-channel features are concatenated in that order into Z. Z also supplies the value path for residual weighting. A single-channel spatial gate is broadcast over Z; the fusion and final stride-two convolution produce 16 × 160 × 160.</desc>
  <metadata>Revision 44, Figure 2. Scientific sources: EnhancedStemBlock.py, the Figure 2 label sheet and revision 44 section 3.2. Layout references: MambaVision (CVPR 2025), Fig. 3 for orthogonal branches; the approved Figure 1 artwork. Native SVG shapes, text and connectors.</metadata>
  <defs>
    <marker id="flow-arrow" viewBox="0 0 9.5 8" refX="9.2" refY="4" markerWidth="9.5" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0.4 0.5 L9.2 4 L0.4 7.5 L1.8 4 Z" fill="#223D4B"/>
    </marker>
    <marker id="weight-arrow" viewBox="0 0 9.5 8" refX="9.2" refY="4" markerWidth="9.5" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0.4 0.5 L9.2 4 L0.4 7.5 L1.8 4 Z" fill="#265F64"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="412.8" fill="#FFFFFF"/>
  <g id="connections" inkscape:label="Data flow">
    <path d="M83 139 H118" stroke="#223D4B" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M118 139 V52 H141" stroke="#223D4B" fill="none" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" id="input-main" data-from="input" data-to="main" marker-end="url(#flow-arrow)"/>
    <path d="M118 139 H141" stroke="#223D4B" fill="none" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" id="input-detail" data-from="input" data-to="detail" marker-end="url(#flow-arrow)"/>
    <path d="M118 139 V226 H141" stroke="#223D4B" fill="none" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" id="input-highpass" data-from="input" data-to="highpass" marker-end="url(#flow-arrow)"/>
    <circle cx="118" cy="139" r="3.05" fill="#223D4B"/>
    <path d="M478 52 H513 V100 H539" stroke="#223D4B" fill="none" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" id="main-concat" data-from="main" data-to="concat" marker-end="url(#flow-arrow)"/>
    <path d="M478 139 H539" stroke="#223D4B" fill="none" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" id="detail-concat" data-from="detail" data-to="concat" marker-end="url(#flow-arrow)"/>
    <path d="M478 226 H513 V178 H539" stroke="#223D4B" fill="none" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" id="highpass-concat" data-from="highpass" data-to="concat" marker-end="url(#flow-arrow)"/>
    <path d="M668 139 H717" stroke="#223D4B" fill="none" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" id="z-gate" data-from="concat" data-to="gate" marker-end="url(#flow-arrow)"/>
    <path d="M691 139 V298" stroke="#223D4B" fill="none" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" id="z-value" data-from="concat" data-to="weighting" marker-end="url(#flow-arrow)"/>
    <circle cx="691" cy="139" r="3.05" fill="#223D4B"/>
    <path d="M836 222 V298" stroke="#265F64" fill="none" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" id="gate-weight" data-from="gate" data-to="weighting" marker-end="url(#weight-arrow)"/>
    <path d="M658 341 H614" stroke="#223D4B" fill="none" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" id="weight-fusion" data-from="weighting" data-to="fusion" marker-end="url(#flow-arrow)"/>
    <path d="M367 341 H322" stroke="#223D4B" fill="none" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" id="fusion-downsample" data-from="fusion" data-to="downsample" marker-end="url(#flow-arrow)"/>
    <path d="M144 341 H85" stroke="#223D4B" fill="none" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" id="downsample-output" data-from="downsample" data-to="output" marker-end="url(#flow-arrow)"/>
  </g>
