    <text x="58" y="189" fill="#405968" font-family="Arial, Helvetica, sans-serif" font-size="15.8" text-anchor="middle" font-weight="normal">3 × 640 × 640</text>
  </g>
  <g id="output" inkscape:label="Output">
    <path d="M37.0 325.88 l12 -5.76 H85.0 L73.0 325.88 Z" stroke="#4F7884" fill="#DEEBE9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
