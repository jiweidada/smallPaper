    <path d="M473 153 H495" stroke="#223D4B" fill="none" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" id="up2-grid2" data-from="up2" data-to="grid2" marker-end="url(#flow-arrow)"/>
    <path d="M297 225 H319" stroke="#223D4B" fill="none" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" id="pool4-up4" data-from="pool4" data-to="up4" marker-end="url(#flow-arrow)"/>
    <path d="M473 225 H495" stroke="#223D4B" fill="none" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" id="up4-grid4" data-from="up4" data-to="grid4" marker-end="url(#flow-arrow)"/>
