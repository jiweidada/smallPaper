<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="167.64mm" height="48.61560mm" viewBox="0 0 960 278.4" version="1.1" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">MSCA-Lite pooling and energy gating</title>
  <desc id="fig-desc">Two average-pooled maps and the identity map are aligned to the original 40 × 40 spatial grid and averaged. The energy gate uses per-channel spatial statistics of the mean feature. Its weights multiply the original 512-channel input F.</desc>
  <metadata>Revision 44, Figure 4. Scientific sources: MSCA_Lite.py, Figure 4 labels and equations (1)–(2) in the revision 44 manuscript. Layout references: MambaVision (CVPR 2025), Fig. 3 for the separate direct value path; the approved Figure 1 artwork. Native SVG shapes, text and connectors.</metadata>
