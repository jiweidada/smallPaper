    <path d="M127 153 H150" stroke="#223D4B" fill="none" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" id="input-pool2" data-from="input" data-to="pool2" marker-end="url(#flow-arrow)"/>
    <path d="M127 153 V225 H150" stroke="#223D4B" fill="none" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" id="input-pool4" data-from="input" data-to="pool4" marker-end="url(#flow-arrow)"/>
    <circle cx="127" cy="153" r="3.05" fill="#223D4B"/>
