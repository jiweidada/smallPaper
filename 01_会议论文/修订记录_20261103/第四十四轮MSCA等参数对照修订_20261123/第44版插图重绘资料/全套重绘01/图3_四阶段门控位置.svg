  <text x="18" y="174" fill="#223D4B" font-family="Arial, Helvetica, sans-serif" font-size="17.8" text-anchor="start" font-weight="bold">Inside each</text>
  <text x="18" y="197" fill="#223D4B" font-family="Arial, Helvetica, sans-serif" font-size="17.8" text-anchor="start" font-weight="bold">HG block</text>
