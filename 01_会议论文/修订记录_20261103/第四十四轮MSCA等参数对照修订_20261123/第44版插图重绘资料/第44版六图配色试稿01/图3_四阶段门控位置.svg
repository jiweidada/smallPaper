  <title id="fig-title">Stage gates and a cutaway of the second block of stage 3</title>
  <desc id="fig-desc">The left column shows the gated HG blocks in backbone order. A dashed leader opens the second block of stage 3. Its input and three layer outputs are concatenated in channel order, projected from 704 to 512 channels, and gated by MSCA-Lite. The residual from the block input is added after the gate.</desc>
  <metadata>Revision 44, Figure 3. Scientific source: HG_Block.forward, HG_Stage and B0 settings in hgnetv2_MSCA_EnhancedStem.py, and the Rev44 Figure 3 label sheet. Design reference: DiffusionDrive, CVPR 2025, Fig. 4, for the overview-to-block layout.</metadata>
