<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="167.64mm" height="51.689000mm" viewBox="0 0 960 296" version="1.1" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Stage gates in the B0 backbone</title>
  <desc id="fig-desc">Each top-row icon represents one HG block; the colored terminal marks the gate. Stage 3 uses two separate Lite gates, with the second block's input added after its gate. The lower cutaway traces the block input and the three layer outputs into channel concatenation, full-width pointwise projection and the stage gate.</desc>
  <metadata>Revision 44, Figure 3. Scientific source: Figure 3 label sheet, HG_Block.forward and HG_Stage in hgnetv2_MSCA_EnhancedStem.py, and the B0 config. Design reference: MambaVision, CVPR 2025, Fig. 2, for a staged architecture strip.</metadata>
